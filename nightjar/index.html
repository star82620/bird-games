<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜鷹吃蟲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen night street. The game canvas fills the frame, HUD floats over the sky, controls strip sits below. */
:root {
  --night: #0c1224;
  --night-2: #151e38;
  --line: #2a3352;
  --lamp: #ffd27a;
  --moth: #f3e7c4;
  --ink: #ece6d6;
  --muted: #98a1b8;
  --soft: #c9cdd8;
  --danger: #ff9a7a;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "BiauKai", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--night); }
body { margin: 0; font-size: 14px; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 16px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: 0.04em;
  color: var(--ink);
}
h1 small {
  font-size: 0.85rem;
  font-weight: 400;
  color: var(--muted);
  margin-left: 10px;
  letter-spacing: 0.02em;
}
.best { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.best b { color: var(--lamp); font-weight: 700; }

#stage {
  position: relative;
  flex: 1;
  min-height: 300px;
  border-radius: 14px;
  overflow: hidden;
  background: var(--night-2);
  border: 1px solid var(--line);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: pointer;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute;
  top: 12px; left: 14px; right: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.count {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--lamp);
  line-height: 1;
  min-width: 3.2em;
}
.count span { font-size: 0.9rem; color: var(--muted); font-family: var(--font-body); font-weight: 400; margin-left: 4px; }
.dawn { flex: 1; max-width: 260px; display: grid; gap: 4px; margin-left: auto; }
.dawn-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-align: right; }
.dawn-bar { height: 5px; border-radius: 3px; background: rgba(236, 230, 214, 0.14); overflow: hidden; }
.dawn-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--muted), var(--danger)); }

.panel {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(8, 12, 26, 0.55);
}
.card {
  max-width: 420px;
  display: grid;
  gap: 12px;
  text-align: left;
  background: rgba(12, 18, 36, 0.86);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 22px 20px;
  cursor: default;
}
.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 700;
  text-wrap: balance;
}
.card p { margin: 0; line-height: 1.75; color: var(--ink); font-size: 0.95rem; }
.card .note { color: var(--muted); font-size: 0.82rem; }
.card .big { font-family: var(--font-display); font-size: 1.25rem; }
.card .big b { color: var(--lamp); font-size: 1.8rem; margin: 0 4px; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 0.92rem; line-height: 1.6; }
.rules li { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; }
.rules .k { color: var(--lamp); font-weight: 500; }
button {
  justify-self: start;
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  color: var(--night);
  background: var(--lamp);
  border: 0;
  border-radius: 999px;
  padding: 10px 22px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:hover { filter: brightness(1.06); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
kbd {
  font-family: var(--font-body);
  font-size: 0.78em;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px;
  color: var(--ink);
}
footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 16px;
  font-size: 0.82rem;
  color: var(--muted);
}
footer b { color: var(--ink); font-weight: 500; }
.fact {
  display: grid;
  gap: 6px;
  margin-top: 4px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.fact-label {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--lamp);
}
.card .fact p { font-size: 14px; line-height: 1.7; color: var(--soft); }
.hint-touch { display: none; }
@media (hover: none) and (pointer: coarse) {
  .hint-key { display: none; }
  .hint-touch { display: inline; }
}
</style>
</head>
<body>

<header>
  <h1>夜鷹吃蟲<small>一晚 60 秒，天亮前吃越多越好</small></h1>
  <div class="best">最佳紀錄 <b id="best">0</b> 隻</div>
</header>

<div id="stage" aria-label="遊戲畫面：按住張嘴吃蟲，放開閉嘴往上飛">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="count" id="score">0<span>隻蟲</span></div>
    <div class="dawn">
      <div class="dawn-label" id="dawnLabel">離天亮 60 秒</div>
      <div class="dawn-bar"><div class="dawn-fill" id="dawnFill"></div></div>
    </div>
  </div>

  <div class="panel" id="panelStart">
    <div class="card">
      <h2>今晚出門吃蟲</h2>
      <p>台灣夜鷹會在夜晚的空中飛來飛去，張開大嘴，邊飛邊把飛蟲撈進嘴裡。</p>
      <ul class="rules">
        <li><span class="k">按住</span><span>張嘴吃蟲。嘴巴張開風阻大，會往下掉、飛得慢</span></li>
        <li><span class="k">放開</span><span>閉嘴往上飛</span></li>
        <li><span class="k">小心</span><span>不要撞到地面和路燈</span></li>
      </ul>
      <button type="button" id="btnStart">開始</button>
    </div>
  </div>

  <div class="panel" id="panelOver" hidden>
    <div class="card">
      <h2 id="overTitle">天亮了</h2>
      <p class="big">這一晚吃了<b id="overScore">0</b>隻蟲</p>
      <p class="note" id="overNote"></p>
      <button type="button" id="btnAgain">再飛一晚</button>
      <div class="fact">
        <span class="fact-label">你知道嗎？</span>
        <p id="factText"></p>
      </div>
    </div>
  </div>
</div>

<footer>
  <span class="hint-key"><b>空白鍵或滑鼠</b>：按住張嘴，放開閉嘴</span>
  <span class="hint-touch"><b>按住畫面</b>：張嘴，放開閉嘴</span>
  <span>台灣夜鷹 <i>Caprimulgus affinis</i>，叫聲像「追、追、追」</span>
</footer>

<script>
(() => {
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), dawnLabel = $('dawnLabel'), dawnFill = $('dawnFill');
  const panelStart = $('panelStart'), panelOver = $('panelOver');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const C = {
    skyTopNight: [11, 16, 34], skyBotNight: [27, 37, 66],
    skyTopDawn: [52, 64, 112], skyBotDawn: [222, 150, 116],
    far: '#18213d', near: '#111830', ground: '#080c18', line: '#2a3352',
    lamp: '255,210,122', moth: '243,231,196', ink: '#ece6d6',
    feather: '#7d5f42', featherDark: '#4d3a28', featherLight: '#b8996f', patch: '#f1ecdf',
    gape: '#d9667a', gapeIn: '#4d1825'
  };

  const NIGHT = 60;
  const GROUND = 38;
  let W = 960, H = 540, scale = 1;

  function resize() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    // fit the width, but on tall portrait screens cap the world at 720 units high
    scale = Math.max(Math.min(cv.height / 540, cv.width / 600), cv.height / 720);
    W = cv.width / scale;
    H = cv.height / scale;
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  let best = 0;
  try { best = parseInt(localStorage.getItem('nightjar-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.6, r: rand(0.5, 1.5), tw: rand(0, 6) }));

  let state = 'ready', T = 0, dist = 0, speed = 140;
  let bird, lamps, bugs, pops, score, combo, timeLeft, nextLamp, overAt = 0;
  let holding = false, needRelease = false, wasOpen = false;

  // narrow screens: keep the bird further left so more of the road ahead is visible
  const birdX = () => W < 500 ? W * 0.2 : Math.min(W * 0.3, 250);
  const groundY = () => H - GROUND;

  function reset() {
    bird = { y: H * 0.36, vy: 0, mouth: 0, flap: 0 };
    lamps = []; bugs = []; pops = [];
    score = 0; combo = 0; timeLeft = NIGHT; dist = 0; speed = 200;
    nextLamp = W * 0.85;
    wasOpen = false;
  }

  function spawnLamp(x) {
    const gy = groundY();
    const h = rand(130, Math.max(140, gy - 140));
    const headY = gy - h;
    lamps.push({ x, headY });
    // swarm sits in the light cone, with a gap below the lamp head
    const cx = x + 28, cy = headY + 66;
    const n = Math.floor(rand(7, 14));
    for (let i = 0; i < n; i++) {
      bugs.push({ cx, cy, rx: rand(18, 62), ry: rand(12, 38), w: rand(1.2, 2.6) * (Math.random() < 0.5 ? -1 : 1), ph: rand(0, 6.28), drift: 0, x: cx, y: cy, alive: true });
    }
    // a few stray insects up high between lamps
    if (Math.random() < 0.55) {
      // keep stray insects around cruise height so they stay reachable
      const fx = x + rand(160, 260), fy = rand(H * 0.18, Math.max(H * 0.18 + 10, headY - 30));
      const m = Math.floor(rand(2, 5));
      for (let i = 0; i < m; i++) {
        bugs.push({ cx: fx + rand(-20, 20), cy: fy + rand(-14, 14), rx: rand(6, 16), ry: rand(5, 12), w: rand(1.5, 3), ph: rand(0, 6.28), drift: 18, x: fx, y: fy, alive: true });
      }
    }
  }

  function start() {
    reset();
    state = 'play';
    panelStart.hidden = true;
    panelOver.hidden = true;
  }

  // one random fact per game over; sources in art/nightjar-research.md
  const FACTS = [
    '夜鷹也被叫做「蚊母鳥」，但研究人員檢查了 43 隻夜鷹的胃，一隻蚊子都沒找到。牠們吃最多的是蛾，其次是金龜子、天牛和白蟻。',
    '夜鷹不築巢，直接在地上下蛋。牠們原本大多在河床的空地繁殖，現在城市頂樓也找得到牠們的蹤跡。說不定你家頂樓就有唷！',
    '夜鷹每次只下 2 顆蛋。蛋剛產下時是粉紅色帶褐斑，之後會慢慢變白。夜鷹寶寶一孵出來就會自己走動，曾經有出生第一天的雛鳥，一天就走了 13 公尺。',
    '夜鷹不只會「追、追」叫。在天敵靠近時會「呱、呱、呱」，傍晚出門前會低沉地「叩叩叩叩」，雛鳥則會「勾、勾」呼叫爸媽。',
    '春夏夜晚常聽到「追—追—」的響亮叫聲，就是夜鷹雄鳥在宣示地盤和求偶。夜深人靜時，600 公尺外的錄音筆還錄得到哦！',
    '白天的夜鷹會停在地面、河床或屋頂上休息。一身灰褐色、布滿細紋的羽毛就是牠們的保護色，讓天敵很難發現。也讓許多民眾以為牠受傷需要救援，其實人家只是在休息啦！'
  ];
  let lastFact = -1;
  function nextFact() {
    let i = Math.floor(Math.random() * FACTS.length);
    if (i === lastFact) i = (i + 1) % FACTS.length;
    lastFact = i;
    return FACTS[i];
  }

  function end(reason) {
    state = 'over';
    overAt = performance.now();
    holding = false;
    const titles = { dawn: '天亮了', ground: '掉到地上了', lamp: '撞上路燈了' };
    $('overTitle').textContent = titles[reason];
    $('overScore').textContent = score;
    let note = '';
    if (score > best) {
      note = best > 0 ? `新紀錄！比之前多吃了 ${score - best} 隻。` : '第一晚的紀錄。';
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('nightjar-best', String(best)); } catch (e) {}
    } else {
      note = `最佳紀錄是 ${best} 隻。`;
    }
    if (reason !== 'dawn') note += ` 還剩 ${Math.ceil(timeLeft)} 秒才天亮。`;
    $('overNote').textContent = note;
    $('factText').textContent = nextFact();
    panelOver.hidden = false;
  }

  // ---------- input ----------
  function press() {
    if (state === 'ready') { start(); needRelease = true; holding = true; return; }
    if (state === 'over') {
      if (performance.now() - overAt < 700) return;
      start(); needRelease = true; holding = true; return;
    }
    holding = true;
  }
  function release() { holding = false; needRelease = false; }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowDown') {
      e.preventDefault();
      if (e.repeat) return;
      press();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); release(); }
  });
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.card')) return;
    e.preventDefault();
    press();
  });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);
  stage.addEventListener('contextmenu', e => e.preventDefault());
  $('btnStart').addEventListener('click', e => { e.currentTarget.blur(); start(); });
  $('btnAgain').addEventListener('click', e => { e.currentTarget.blur(); start(); });

  // ---------- update ----------
  function update(dt) {
    T += dt;
    if (state === 'over') { updatePops(dt); return; }
    const playing = state === 'play';
    const open = playing ? (holding && !needRelease) : Math.sin(T * 0.9) > 0.7;

    bird.mouth += ((open ? 1 : 0) - bird.mouth) * Math.min(1, dt * 14);
    bird.flap += dt * (open ? 4 : 9);

    if (playing) {
      // closed mouth: spring toward a slowly wandering cruise height instead of the ceiling
      const cruiseY = H * 0.26 + Math.sin(T * 0.55) * 34 + Math.sin(T * 1.37 + 1.3) * 14;
      const acc = open ? 520 : clamp((cruiseY - bird.y) * 7 - bird.vy * 3.2, -460, 360);
      bird.vy = clamp(bird.vy + acc * dt, -230, 300);
      bird.y += bird.vy * dt;
      if (bird.y < 40) { bird.y = 40; if (bird.vy < 0) bird.vy = 0; }
      const base = 200 + (NIGHT - timeLeft) * 2.2;
      speed += ((open ? base * 0.7 : base) - speed) * Math.min(1, dt * 3);
      timeLeft -= dt;
    } else {
      bird.y = H * 0.38 + Math.sin(T * 1.6) * 18;
      bird.vy = Math.cos(T * 1.6) * 29;
      speed = 140;
    }
    dist += speed * dt;

    while (nextLamp < dist + W + 120) {
      spawnLamp(nextLamp);
      nextLamp += rand(380, 620);
    }

    for (const b of bugs) {
      if (!b.alive) continue;
      b.cx -= b.drift * dt;
      b.x = b.cx + Math.cos(T * b.w + b.ph) * b.rx;
      b.y = b.cy + Math.sin(T * b.w * 1.3 + b.ph) * b.ry;
    }

    const bx = birdX();
    if (playing) {
      // eating
      if (bird.mouth > 0.5) {
        const mx = bx + 22, my = bird.y + 4;
        for (const b of bugs) {
          if (!b.alive) continue;
          const dx = b.x - dist - mx, dy = b.y - my;
          if (dx * dx + dy * dy < 24 * 24) {
            b.alive = false;
            score++; combo++;
            pops.push({ x: mx + 8, y: my - 14, text: combo >= 3 ? `連吃 ${combo}` : '+1', life: 1, big: combo >= 3 });
          }
        }
      }
      if (wasOpen && !open) combo = 0;
      wasOpen = open;

      // collisions
      const r = 10;
      if (bird.y + r > groundY()) return end('ground');
      for (const l of lamps) {
        const sx = l.x - dist;
        if (sx < bx - 80 || sx > bx + 80) continue;
        // only the lamp head is solid; the bird flies in front of the pole
        if (circleRect(bx, bird.y, r, sx + 14, l.headY - 6, 28, 14)) return end('lamp');
      }
      if (timeLeft <= 0) { timeLeft = 0; return end('dawn'); }
    }

    lamps = lamps.filter(l => l.x - dist > -140);
    bugs = bugs.filter(b => b.alive && b.x - dist > -140);
    updatePops(dt);
  }

  function updatePops(dt) {
    for (const p of pops) { p.life -= dt * 1.4; p.y -= dt * 34; }
    pops = pops.filter(p => p.life > 0);
  }

  function circleRect(cx, cy, r, x, y, w, h) {
    const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ---------- draw ----------
  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    const p = state === 'ready' ? 0 : clamp(1 - timeLeft / NIGHT, 0, 1);
    const dawn = clamp((p - 0.55) / 0.45, 0, 1);
    const gy = groundY();

    const g = ctx.createLinearGradient(0, 0, 0, gy);
    g.addColorStop(0, mix(C.skyTopNight, C.skyTopDawn, dawn));
    g.addColorStop(1, mix(C.skyBotNight, C.skyBotDawn, dawn));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      const tw = reduceMotion ? 0.8 : 0.55 + 0.45 * Math.sin(T * 1.7 + s.tw);
      ctx.globalAlpha = tw * (1 - dawn);
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.arc(s.x * W, s.y * gy, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // moon
    ctx.save();
    ctx.globalAlpha = 1 - dawn * 0.7;
    ctx.fillStyle = '#f3ead2';
    ctx.beginPath(); ctx.arc(W * 0.84, 78, 20, 0, 7); ctx.fill();
    ctx.fillStyle = mix(C.skyTopNight, C.skyTopDawn, dawn);
    ctx.beginPath(); ctx.arc(W * 0.84 + 8, 72, 18, 0, 7); ctx.fill();
    ctx.restore();

    drawSkyline(dist * 0.18, 64, 90, 230, C.far, 0.25, 11);
    drawSkyline(dist * 0.42, 86, 50, 150, C.near, 0.5, 37);

    // ground
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, gy, W, GROUND);
    ctx.fillStyle = C.line;
    ctx.fillRect(0, gy, W, 2);
    ctx.fillStyle = 'rgba(236,230,214,0.18)';
    const off = dist % 70;
    for (let x = -off; x < W; x += 70) ctx.fillRect(x, gy + 21, 34, 3);

    // lamp light first, then poles
    for (const l of lamps) drawLampLight(l.x - dist, l.headY, gy);
    for (const l of lamps) drawLampPost(l.x - dist, l.headY, gy);

    // bugs
    for (const b of bugs) {
      if (!b.alive) continue;
      const sx = b.x - dist;
      if (sx < -10 || sx > W + 10) continue;
      const flick = reduceMotion ? 0.85 : 0.6 + 0.4 * Math.sin(T * 30 + b.ph * 5);
      ctx.fillStyle = `rgba(${C.lamp},${0.22 * flick})`;
      ctx.beginPath(); ctx.arc(sx, b.y, 4.5, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(${C.moth},${flick})`;
      ctx.beginPath(); ctx.ellipse(sx, b.y, 2.2, 1.6, 0, 0, 7); ctx.fill();
    }

    drawBird(birdX(), bird.y, bird.mouth, bird.flap, bird.vy);

    // pops
    ctx.textAlign = 'left';
    for (const pp of pops) {
      ctx.globalAlpha = clamp(pp.life, 0, 1);
      ctx.fillStyle = `rgb(${C.lamp})`;
      ctx.font = `700 ${pp.big ? 17 : 14}px "LXGW WenKai TC", "Kaiti TC", serif`;
      ctx.fillText(pp.text, pp.x, pp.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawSkyline(off, slot, minH, maxH, color, winAlpha, seed) {
    const gy = groundY();
    const first = Math.floor(off / slot) - 1;
    const count = Math.ceil(W / slot) + 3;
    for (let i = first; i < first + count; i++) {
      const x = i * slot - off;
      const h = minH + hash(i * 1.7 + seed) * (maxH - minH);
      const w = slot * (0.72 + hash(i * 3.1 + seed) * 0.28);
      const top = gy - h;
      ctx.fillStyle = color;
      ctx.fillRect(x, top, w, h);
      if (hash(i * 5.3 + seed) > 0.7) ctx.fillRect(x + w * 0.3, top - 14, 3, 14); // antenna
      for (let r = 0; r * 14 + 12 < h - 10; r++) {
        for (let c = 0; c * 12 + 10 < w - 6; c++) {
          if (hash(i * 13.7 + r * 7.1 + c * 3.3 + seed) > 0.86) {
            ctx.fillStyle = `rgba(${C.lamp},${winAlpha})`;
            ctx.fillRect(x + 7 + c * 12, top + 10 + r * 14, 5, 6);
          }
        }
      }
    }
  }

  function drawLampLight(sx, headY, gy) {
    if (sx < -160 || sx > W + 160) return;
    const hx = sx + 28;
    const cone = ctx.createLinearGradient(0, headY, 0, gy);
    cone.addColorStop(0, `rgba(${C.lamp},0.26)`);
    cone.addColorStop(1, `rgba(${C.lamp},0.02)`);
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(hx - 8, headY + 4);
    ctx.lineTo(hx + 8, headY + 4);
    ctx.lineTo(hx + 70, gy);
    ctx.lineTo(hx - 70, gy);
    ctx.closePath();
    ctx.fill();
    const glow = ctx.createRadialGradient(hx, headY + 6, 2, hx, headY + 6, 80);
    glow.addColorStop(0, `rgba(${C.lamp},0.45)`);
    glow.addColorStop(1, `rgba(${C.lamp},0)`);
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(hx, headY + 6, 80, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(${C.lamp},0.35)`;
    ctx.beginPath(); ctx.ellipse(hx, gy + 3, 60, 5, 0, 0, 7); ctx.fill();
  }

  function drawLampPost(sx, headY, gy) {
    if (sx < -60 || sx > W + 60) return;
    ctx.fillStyle = '#2c3556';
    ctx.fillRect(sx - 3, headY, 6, gy - headY);
    ctx.fillRect(sx - 6, gy - 10, 12, 10);
    ctx.strokeStyle = '#2c3556';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sx, headY + 6);
    ctx.quadraticCurveTo(sx + 2, headY - 2, sx + 16, headY);
    ctx.stroke();
    ctx.fillStyle = '#3b4570';
    ctx.beginPath();
    ctx.moveTo(sx + 14, headY - 5); ctx.lineTo(sx + 42, headY - 5);
    ctx.lineTo(sx + 38, headY + 5); ctx.lineTo(sx + 18, headY + 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgb(${C.lamp})`;
    ctx.beginPath(); ctx.ellipse(sx + 28, headY + 6, 9, 2.5, 0, 0, 7); ctx.fill();
  }

  function drawWing(angle, color, patchColor) {
    ctx.save();
    ctx.translate(3, -4);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(-2, -6);
    ctx.lineTo(-40, -8);
    ctx.lineTo(-31, -1);
    ctx.lineTo(-10, 5);
    ctx.closePath();
    ctx.fill();
    // white patch on the primaries, a Taiwan nightjar field mark
    ctx.fillStyle = patchColor;
    ctx.beginPath();
    ctx.moveTo(-24, -7.4); ctx.lineTo(-19, -7); ctx.lineTo(-19.5, -3); ctx.lineTo(-24.5, -3.6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawBird(x, y, m, flap, vy) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(clamp(vy / 650, -0.35, 0.4));
    ctx.scale(1.15, 1.15);

    const a = Math.sin(flap) * 0.8 - 0.1;
    drawWing(a + 0.25, C.featherDark, 'rgba(241,236,223,0.55)');

    // tail with white corners
    ctx.fillStyle = '#5c4630';
    ctx.beginPath();
    ctx.moveTo(-12, -3); ctx.lineTo(-40, -6); ctx.lineTo(-41, 3); ctx.lineTo(-12, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.patch;
    ctx.fillRect(-41, -5.5, 5, 2.4);
    ctx.fillRect(-41, 0.6, 5, 2.4);

    // body
    ctx.fillStyle = C.feather;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 8.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C.featherDark;
    for (const [mx, my, r] of [[-6, -3, 2], [2, -4, 1.6], [-10, 1, 1.8], [6, 2, 1.4], [-2, 3, 1.5]]) {
      ctx.beginPath(); ctx.ellipse(mx, my, r * 1.4, r, 0.3, 0, 7); ctx.fill();
    }
    ctx.fillStyle = C.featherLight;
    for (const [mx, my] of [[-3, -1], [4, -1], [-8, 3]]) {
      ctx.beginPath(); ctx.ellipse(mx, my, 1.8, 0.9, 0.2, 0, 7); ctx.fill();
    }

    // gape: interior, then lower jaw rotating open from the hinge
    const hx = 9, hy = 0;
    const ang = m * 0.95;
    const rot = (px, py) => [hx + px * Math.cos(ang) - py * Math.sin(ang), hy + px * Math.sin(ang) + py * Math.cos(ang)];
    if (m > 0.04) {
      const lt = rot(16, 1);
      ctx.fillStyle = C.gape;
      ctx.beginPath(); ctx.moveTo(hx, hy - 1); ctx.lineTo(24, -3); ctx.lineTo(lt[0], lt[1]); ctx.closePath(); ctx.fill();
      const lt2 = rot(11, 1);
      ctx.fillStyle = C.gapeIn;
      ctx.beginPath(); ctx.moveTo(hx + 1, hy); ctx.lineTo(19, -1.5); ctx.lineTo(lt2[0], lt2[1]); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = C.feather;
    const j = [rot(0, 0), rot(16, 1), rot(15, 4), rot(2, 6.5)];
    ctx.beginPath(); ctx.moveTo(j[0][0], j[0][1]);
    for (let i = 1; i < j.length; i++) ctx.lineTo(j[i][0], j[i][1]);
    ctx.closePath(); ctx.fill();

    // head and upper bill
    ctx.fillStyle = C.feather;
    ctx.beginPath(); ctx.arc(14, -3, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2c1e';
    ctx.beginPath(); ctx.moveTo(20, -4); ctx.lineTo(25, -2.6); ctx.lineTo(20, -1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.featherDark;
    ctx.beginPath(); ctx.ellipse(12, -7, 4, 1.4, -0.2, 0, 7); ctx.fill();

    // rictal bristles show when the mouth is open
    if (m > 0.3) {
      ctx.strokeStyle = `rgba(58,44,30,${m})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(21, -3); ctx.lineTo(28, -6);
      ctx.moveTo(21, -2.5); ctx.lineTo(28.5, -3.5);
      ctx.stroke();
    }

    // eye
    ctx.fillStyle = '#120c08';
    ctx.beginPath(); ctx.arc(16, -5, 2.7, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,210,0.9)';
    ctx.beginPath(); ctx.arc(16.8, -5.9, 0.8, 0, 7); ctx.fill();

    drawWing(a, '#6c5139', C.patch);
    ctx.restore();
  }

  // ---------- HUD ----------
  let lastScore = -1, lastSec = -1;
  function hud() {
    if (score !== lastScore) {
      scoreEl.firstChild.nodeValue = String(score);
      lastScore = score;
    }
    const sec = state === 'ready' ? NIGHT : Math.ceil(timeLeft);
    if (sec !== lastSec) {
      dawnLabel.textContent = sec > 0 ? `離天亮 ${sec} 秒` : '天亮了';
      lastSec = sec;
    }
    dawnFill.style.width = `${(state === 'ready' ? 0 : (1 - timeLeft / NIGHT)) * 100}%`;
  }

  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    hud();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
